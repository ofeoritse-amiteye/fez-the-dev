<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Interactive portfolio for Ofeoritse - frontend engineering, realtime systems, AI tooling, and polished product experiences."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400..800&family=Syne:wght@400..800&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var key = 'portfolio-theme';
					var saved = localStorage.getItem(key);
					if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
				} catch (error) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
